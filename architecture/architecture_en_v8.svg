<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1440" viewBox="0 0 1280 1440"><rect width="1280" height="1440" fill="#f4f7fa"/><g font-family="Arial Unicode MS, sans-serif"><rect y="0" width="1280" height="12" fill="#078b83"/><text x="64" y="94" font-size="32" font-weight="bold" fill="#163249">Current prototype architecture</text><text x="64" y="179" font-size="22" fill="#078b83">Host-side review; existing speech services are background</text><rect x="64" y="236" width="350" height="58" fill="#163249"/><text x="78" y="275" font-size="22" fill="white">Input / existing speech APIs</text><text x="452" y="275" font-size="22" fill="#163249">Care text; existing ASR and translation adapters</text><path d="M239 294 L239 304" stroke="#078b83" stroke-width="4"/><polygon points="232,304 246,304 239,311" fill="#078b83"/><rect x="64" y="311" width="350" height="58" fill="#163249"/><text x="78" y="350" font-size="22" fill="white">Host: CareNote review</text><text x="452" y="350" font-size="22" fill="#163249">Split source statements; attach exact text evidence</text><path d="M239 369 L239 379" stroke="#078b83" stroke-width="4"/><polygon points="232,379 246,379 239,386" fill="#078b83"/><rect x="64" y="386" width="350" height="58" fill="#163249"/><text x="78" y="425" font-size="22" fill="white">Worker review</text><text x="452" y="425" font-size="22" fill="#163249">Check side, negation, and quantities; correct draft</text><path d="M239 444 L239 454" stroke="#078b83" stroke-width="4"/><polygon points="232,454 246,454 239,461" fill="#078b83"/><rect x="64" y="461" width="350" height="58" fill="#163249"/><text x="78" y="500" font-size="22" fill="white">Version-linked approval</text><text x="452" y="500" font-size="22" fill="#163249">Store hashes, revision, reviewer, and time</text><path d="M239 519 L239 529" stroke="#078b83" stroke-width="4"/><polygon points="232,529 246,529 239,536" fill="#078b83"/><rect x="64" y="536" width="350" height="58" fill="#163249"/><text x="78" y="575" font-size="22" fill="white">JSON / CSV export</text><text x="452" y="575" font-size="22" fill="#163249">Recheck approval; include evidence and event log</text><rect y="720" width="1280" height="12" fill="#078b83"/><text x="64" y="814" font-size="32" font-weight="bold" fill="#163249">UGen has a specific computation role</text><text x="64" y="899" font-size="22" fill="#078b83">Stage II: validate speech recognition on B70</text><rect x="64" y="956" width="350" height="70" fill="#163249"/><text x="78" y="995" font-size="22" fill="white">Audio / host interface</text><text x="452" y="995" font-size="22" fill="#163249">Receive consented test audio and manage review</text><path d="M239 1026 L239 1044" stroke="#078b83" stroke-width="4"/><polygon points="232,1044 246,1044 239,1051" fill="#078b83"/><rect x="64" y="1051" width="350" height="70" fill="#078b83"/><text x="78" y="1090" font-size="22" fill="white">B70 / OpenVINO ASR</text><text x="452" y="1090" font-size="22" fill="#163249">Run speech recognition in the designated environment</text><path d="M239 1121 L239 1139" stroke="#078b83" stroke-width="4"/><polygon points="232,1139 246,1139 239,1146" fill="#078b83"/><rect x="64" y="1146" width="350" height="70" fill="#163249"/><text x="78" y="1185" font-size="22" fill="white">Host: CareNote review</text><text x="452" y="1185" font-size="22" fill="#163249">Keep evidence checks and approval on the host</text><text x="64" y="1315" font-size="21" fill="#163249">OpenVINO is a candidate integration path.</text><text x="64" y="1343" font-size="21" fill="#163249">Our model compatibility and actual GPU execution are not yet verified.</text></g></svg>