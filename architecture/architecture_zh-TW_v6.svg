<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1440" viewBox="0 0 1280 1440"><rect width="1280" height="1440" fill="#f4f7fa"/><g font-family="Arial Unicode MS, sans-serif"><rect y="0" width="1280" height="12" fill="#078b83"/><text x="64" y="94" font-size="38" font-weight="bold" fill="#163249">目前架構：本機介面連接自架語音服務</text><text x="64" y="179" font-size="24" fill="#078b83">ASR、EOLE 翻譯與 TTS；不需要 LLM</text><rect x="64" y="236" width="320" height="58" fill="#163249"/><text x="78" y="274" font-size="24" fill="white">本機瀏覽器</text><text x="420" y="274" font-size="25" fill="#163249">選台語／華語，指定 WAV 音檔</text><text x="218" y="310" font-size="22" fill="#078b83">↓</text><rect x="64" y="311" width="320" height="58" fill="#163249"/><text x="78" y="349" font-size="24" fill="white">本機 Node 介接</text><text x="420" y="349" font-size="25" fill="#163249">送往設定的自架 ASR 服務</text><text x="218" y="385" font-size="22" fill="#078b83">↓</text><rect x="64" y="386" width="320" height="58" fill="#163249"/><text x="78" y="424" font-size="24" fill="white">使用者</text><text x="420" y="424" font-size="25" fill="#163249">確認與修正辨識原文</text><text x="218" y="460" font-size="22" fill="#078b83">↓</text><rect x="64" y="461" width="320" height="58" fill="#163249"/><text x="78" y="499" font-size="24" fill="white">自架 EOLE 翻譯</text><text x="420" y="499" font-size="25" fill="#163249">翻成另一種語言，再確認與修正</text><text x="218" y="535" font-size="22" fill="#078b83">↓</text><rect x="64" y="536" width="320" height="58" fill="#163249"/><text x="78" y="574" font-size="20" fill="white">自架台語／華語 TTS</text><text x="420" y="574" font-size="25" fill="#163249">產生音訊，瀏覽器播放或下載</text><rect y="720" width="1280" height="12" fill="#078b83"/><text x="64" y="814" font-size="38" font-weight="bold" fill="#163249">Stage II：由指定平台執行語音辨識</text><text x="64" y="899" font-size="24" fill="#078b83">Thunderstorm：先驗證 OpenVINO ASR，再評估其他語音模型</text><rect x="64" y="968" width="360" height="70" fill="#163249"/><text x="78" y="1006" font-size="24" fill="white">本機介面／主機</text><text x="455" y="1006" font-size="25" fill="#163249">管理音檔、原文修正與播放</text><text x="218" y="1054" font-size="22" fill="#078b83">↓</text><rect x="64" y="1063" width="360" height="70" fill="#078b83"/><text x="78" y="1101" font-size="24" fill="white">B70／OpenVINO ASR</text><text x="455" y="1101" font-size="25" fill="#163249">指定環境語音辨識：Stage II 驗證</text><text x="218" y="1149" font-size="22" fill="#078b83">↓</text><rect x="64" y="1158" width="360" height="70" fill="#163249"/><text x="78" y="1196" font-size="24" fill="white">既有 EOLE／TTS</text><text x="455" y="1196" font-size="25" fill="#163249">先保留服務，裝置移植另行驗證</text><text x="64" y="1330" font-size="23" fill="#163249">官方提供 OpenVINO／ASR 整合候選路徑；尚未驗證自有模型相容或 GPU 實行。</text></g></svg>