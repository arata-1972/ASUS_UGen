<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1440" viewBox="0 0 1280 1440"><rect width="1280" height="1440" fill="#f4f7fa"/><rect width="1280" height="12" fill="#078b83"/><g font-family="Arial Unicode MS, sans-serif"><text x="64" y="94" font-size="40" font-weight="bold" fill="#163249">現場電腦控制 API 串接與 UGen 推論</text><text x="64" y="179" font-size="25" fill="#078b83">規劃架構：語音處理使用外部 API，工作整理在連接的 UGen 執行</text><rect x="64" y="230" width="294" height="50" fill="#163249"/><text x="78" y="264" font-size="24" fill="white">現場電腦</text><text x="410" y="264" font-size="25" fill="#163249">錄音並呼叫 Taigi API</text><text x="181" y="293" font-size="22" fill="#078b83">↓</text><rect x="64" y="295" width="294" height="50" fill="#163249"/><text x="78" y="329" font-size="24" fill="white">Taigi 外部 API</text><text x="410" y="329" font-size="25" fill="#163249">判定語言、轉寫／翻譯，回傳文字</text><text x="181" y="358" font-size="22" fill="#078b83">↓</text><rect x="64" y="360" width="294" height="50" fill="#163249"/><text x="78" y="394" font-size="24" fill="white">現場電腦</text><text x="410" y="394" font-size="25" fill="#163249">接收文字，啟動 UGen 推論</text><text x="181" y="423" font-size="22" fill="#078b83">↓</text><rect x="64" y="425" width="294" height="50" fill="#078b83"/><text x="78" y="459" font-size="24" fill="white">UGen300</text><text x="410" y="459" font-size="25" fill="#163249">小型語言模型整理工作卡草稿</text><text x="181" y="488" font-size="22" fill="#078b83">↓</text><rect x="64" y="490" width="294" height="50" fill="#163249"/><text x="78" y="524" font-size="24" fill="white">電腦／使用者</text><text x="410" y="524" font-size="25" fill="#163249">格式驗證 → 修正 → 確認後儲存</text><text x="181" y="553" font-size="22" fill="#078b83">↓</text><rect x="64" y="555" width="294" height="50" fill="#163249"/><text x="78" y="589" font-size="24" fill="white">選用：Taigi TTS</text><text x="410" y="589" font-size="25" fill="#163249">電腦呼叫 API，取得台語語音回饋</text><rect y="720" width="1280" height="12" fill="#078b83"/><text x="64" y="814" font-size="40" fill="#163249">未來：企業內部集中處理，多個電腦或平板共同使用</text><text x="64" y="899" font-size="25" fill="#078b83">結合開發中的台語語音 AI，擴展為企業內部服務</text><text x="64" y="980" font-size="25" fill="#163249">我們正在開發可部署於企業內部的台語語音辨識、翻譯與語音合成。</text><text x="64" y="1018" font-size="25" fill="#163249">未來可結合 UGen 的工作整理功能，讓多個電腦或平板共同使用。</text><rect x="64" y="1105" width="350" height="118" fill="#163249"/><text x="76" y="1142" font-size="23" fill="white">多個電腦／平板</text><text x="76" y="1178" font-size="23" fill="white">說工作、查看工作卡</text><text x="420" y="1172" font-size="30" fill="#078b83">→</text><rect x="464" y="1105" width="350" height="118" fill="#078b83"/><text x="476" y="1142" font-size="23" fill="white">企業內部電腦／伺服器</text><text x="476" y="1178" font-size="23" fill="white">Taigi 語音 AI ＋ 連接的 UGen</text><text x="820" y="1172" font-size="30" fill="#078b83">→</text><rect x="864" y="1105" width="350" height="118" fill="#163249"/><text x="876" y="1142" font-size="23" fill="white">使用者核對與修正</text><text x="876" y="1178" font-size="23" fill="white">確認後儲存工作卡</text><text x="64" y="1298" font-size="23" fill="#163249">目前提出架構：外部語音 API ＋ UGen。此頁為後續開發方向。</text><text x="64" y="1332" font-size="23" fill="#163249">模型支援、實際效能與企業內部網路運作仍待驗證。</text></g></svg>