<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1440" viewBox="0 0 1280 1440"><rect width="1280" height="1440" fill="#f4f7fa"/><rect width="1280" height="12" fill="#078b83"/><g font-family="Arial Unicode MS, sans-serif"><text x="64" y="94" font-size="40" font-weight="bold" fill="#163249">現場 PC が API 呼出と UGen 推論を制御</text><text x="64" y="179" font-size="25" fill="#078b83">予定構成：音声は外部 API、仕事整理は PC に接続した UGen で実行</text><rect x="64" y="230" width="294" height="50" fill="#163249"/><text x="78" y="264" font-size="24" fill="white">現場 PC</text><text x="410" y="264" font-size="25" fill="#163249">録音し、Taigi API を呼び出す</text><text x="181" y="293" font-size="22" fill="#078b83">↓</text><rect x="64" y="295" width="294" height="50" fill="#163249"/><text x="78" y="329" font-size="24" fill="white">Taigi 外部 API</text><text x="410" y="329" font-size="25" fill="#163249">言語判定・文字化・翻訳をして返す</text><text x="181" y="358" font-size="22" fill="#078b83">↓</text><rect x="64" y="360" width="294" height="50" fill="#163249"/><text x="78" y="394" font-size="24" fill="white">現場 PC</text><text x="410" y="394" font-size="25" fill="#163249">文章を受け取り、UGen 推論を起動</text><text x="181" y="423" font-size="22" fill="#078b83">↓</text><rect x="64" y="425" width="294" height="50" fill="#078b83"/><text x="78" y="459" font-size="24" fill="white">UGen300</text><text x="410" y="459" font-size="25" fill="#163249">小型言語モデルで仕事カード案を整理</text><text x="181" y="488" font-size="22" fill="#078b83">↓</text><rect x="64" y="490" width="294" height="50" fill="#163249"/><text x="78" y="524" font-size="24" fill="white">PC／利用者</text><text x="410" y="524" font-size="25" fill="#163249">形式検査 → 修正 → 確認して保存</text><text x="181" y="553" font-size="22" fill="#078b83">↓</text><rect x="64" y="555" width="294" height="50" fill="#163249"/><text x="78" y="589" font-size="24" fill="white">任意：Taigi TTS</text><text x="410" y="589" font-size="25" fill="#163249">PC が API を呼び、台湾語音声を取得</text><rect y="720" width="1280" height="12" fill="#078b83"/><text x="64" y="814" font-size="40" fill="#163249">将来：社内で処理をまとめ、複数端末から使う</text><text x="64" y="899" font-size="25" fill="#078b83">開発中の台湾語音声 AI と組み合わせ、社内サービスに広げる</text><text x="64" y="980" font-size="25" fill="#163249">企業内に設置できる台湾語の音声認識・翻訳・音声合成を開発中です。</text><text x="64" y="1018" font-size="25" fill="#163249">将来は UGen の仕事整理と組み合わせ、複数の PC やタブレットから使います。</text><rect x="64" y="1105" width="350" height="118" fill="#163249"/><text x="76" y="1142" font-size="23" fill="white">複数 PC／タブレット</text><text x="76" y="1178" font-size="23" fill="white">仕事を話す・カードを見る</text><text x="420" y="1172" font-size="30" fill="#078b83">→</text><rect x="464" y="1105" width="350" height="118" fill="#078b83"/><text x="476" y="1142" font-size="23" fill="white">社内 PC／サーバー</text><text x="476" y="1178" font-size="23" fill="white">Taigi 音声 AI ＋ 接続した UGen</text><text x="820" y="1172" font-size="30" fill="#078b83">→</text><rect x="864" y="1105" width="350" height="118" fill="#163249"/><text x="876" y="1142" font-size="23" fill="white">本人が確認・修正</text><text x="876" y="1178" font-size="23" fill="white">仕事カードを保存</text><text x="64" y="1298" font-size="23" fill="#163249">今回の提出構成は外部音声 API ＋ UGen。このページは将来の開発方針です。</text><text x="64" y="1332" font-size="23" fill="#163249">対応モデル・実際の性能・社内ネットワークでの稼働を検証します。</text></g></svg>