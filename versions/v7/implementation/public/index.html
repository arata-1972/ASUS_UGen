<!doctype html><html lang="zh-TW"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>TaiwaneseSpeechBridge</title><style>body{background:#0a1724;color:#eff7ff;font:18px system-ui;max-width:1050px;margin:40px auto;padding:0 24px}h1{font-size:36px}section{background:#142b40;border:1px solid #325068;border-radius:14px;padding:24px;margin:20px 0}label{display:block;margin:12px 0}textarea{width:97%;height:110px;background:#071524;color:white;border:1px solid #45647e;border-radius:8px;padding:12px;font:19px system-ui}button,select,input{font:18px system-ui;padding:10px}button{background:#48ddc6;border:0;border-radius:6px;cursor:pointer;margin:10px 8px 0 0}button:disabled{opacity:.4;cursor:wait}pre{white-space:pre-wrap;font:14px ui-monospace;color:#adc9de}small{color:#b3c8dc}audio{width:100%}.error{color:#ffd184}</style>
<h1>TaiwaneseSpeechBridge</h1><p>台語與華語的語音轉文字、翻譯與語音播放</p><small>本機介面串接自架伺服器 API。不是 UGen 實機驗證，未使用 LLM。</small><section><h2>1. 選擇說話語言與音訊</h2><label>說話語言 <select id="language"><option value="tw">台語 → 華語</option><option value="zh">華語 → 台語</option></select></label><input id="file" type="file" accept=".wav,audio/wav"><button id="recognize">音訊轉成文字</button><p id="error" class="error" role="alert"></p><small>選擇 WAV。合成音訊的測試結果，不代表真人語音辨識品質。</small></section><section><h2>2. 確認與修改原文</h2><textarea id="source" placeholder="語音辨識結果會顯示在這裡"></textarea><button id="translate">翻譯成對方語言</button><button id="speakSource">播放原文</button></section><section><h2>3. 確認與修改翻譯</h2><textarea id="target" placeholder="翻譯結果會顯示在這裡"></textarea><button id="speakTarget">播放翻譯</button><audio id="audio" controls></audio><p><a id="download" hidden>下載語音</a></p></section><section><h2>此次執行的測量與狀態</h2><pre id="metrics"></pre><pre id="status"></pre></section>
<script>
const $=id=>document.getElementById(id);let audioUrl,sourceLanguage,metrics=[];
const render=()=>{$('metrics').textContent=JSON.stringify(metrics,null,2)};
async function request(path,body,audio=false){$('error').textContent='';document.querySelectorAll('button').forEach(x=>x.disabled=true);try{const started=performance.now(),r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){const e=await r.json();throw Error(`${e.code}: ${e.message||''}`);}if(audio){const blob=await r.blob();metrics.push({stage:'tts',language:body.language,server_ms:Number(r.headers.get('X-Bridge-Latency-Ms')),client_ms:performance.now()-started});return blob;}const result=await r.json();metrics.push(result);return result;}catch(e){metrics.push({status:'failed',message:e.message});$('error').textContent=e.message;throw e;}finally{render();document.querySelectorAll('button').forEach(x=>x.disabled=false);}}
$('language').onchange=()=>{sourceLanguage=undefined;$('source').value='';$('target').value='';$('audio').removeAttribute('src');$('download').hidden=true;};
$('recognize').onclick=async()=>{const f=$('file').files[0];if(!f){$('error').textContent='請先選擇 WAV 音訊';return;}const bytes=new Uint8Array(await f.arrayBuffer());let raw='';for(let i=0;i<bytes.length;i+=8192)raw+=String.fromCharCode(...bytes.subarray(i,i+8192));try{const r=await request('/api/recognize',{audio:btoa(raw),language:$('language').value});sourceLanguage=r.source_language;$('source').value=r.text;$('target').value='';}catch{}};
$('translate').onclick=async()=>{try{const r=await request('/api/translate',{text:$('source').value,language:sourceLanguage||$('language').value});$('target').value=r.text;}catch{}};
async function speak(text,language){try{const blob=await request('/api/speak',{text,language},true);if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=URL.createObjectURL(blob);$('audio').src=audioUrl;$('download').href=audioUrl;$('download').download='speech.wav';$('download').hidden=false;$('download').textContent='下載語音';}catch{}}
$('speakSource').onclick=()=>speak($('source').value,sourceLanguage||$('language').value);$('speakTarget').onclick=()=>speak($('target').value,(sourceLanguage||$('language').value)==='tw'?'zh':'tw');
fetch('/api/status').then(r=>r.json()).then(x=>$('status').textContent=JSON.stringify(x,null,2));
</script></html>
